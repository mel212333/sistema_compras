services:
  postgres:
    image: postgres:16
    container_name: nuevo-proyecto-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nuevo_proyecto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
