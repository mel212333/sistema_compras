services:
  - type: web
    runtime: docker
    name: compras-backend
    repo: https://github.com/mel212333/compras-backend-node.git
    branch: master
    plan: starter
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: compras-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 1d
      - key: CORS_ORIGIN
        sync: false
      - key: DB_SYNC
        value: "true"
      - key: DB_SYNC_ALTER
        value: "false"
      - key: DEMO_SEED
        value: "true"
      - key: DEMO_PASSWORD
        sync: false

databases:
  - name: compras-db
    databaseName: sistema_compras
    user: compras_user
    plan: basic-1gb
